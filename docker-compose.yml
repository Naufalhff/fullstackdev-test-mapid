services:
  db:
    image: postgres:16-alpine
    container_name: mapid-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reports
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reports"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    container_name: mapid-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/reports
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: MapidTestFullstack2026!
    ports:
      - "3000:3000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: mapid-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
